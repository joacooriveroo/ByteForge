<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Contactá a ByteForge para realizar consultas sobre hardware, componentes y configuraciones de computadoras.">

    <meta name="keywords" content="contacto ByteForge, consultas de hardware, componentes de PC, configuraciones de PC, computadoras">

    <title>Contacto | ByteForge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
</head>

<body>
    <header class="encabezado">
        <nav class="navbar navbar-expand-lg">
            <a href="../index.html" class="logo">ByteForge</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú de navegación">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="menu">
                    <li><a href="../index.html">Inicio</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="armados.html">Armados</a></li>
                    <li><a href="nosotros.html">Nosotros</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section class="contacto">
            <h1>Contacto</h1>
            <p>¿Tenés alguna consulta? Escribinos y te respondemos.</p>

            <form class="formulario" data-aos="fade-up">
                <div>
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div>
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div>
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
                </div>

                <button type="submit" class="boton">Enviar</button>
            </form>
        </section>
    </main>

    <footer class="pie-pagina">
        <p>ByteForge - Hardware y tecnología</p>

        <nav class="redes-sociales" aria-label="Redes sociales">
            <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                <img src="../assets/img/logos/instagram.png" alt="Instagram">
            </a>

            <a href="https://x.com/" target="_blank" rel="noopener noreferrer" aria-label="X">
                <img src="../assets/img/logos/x.png" alt="X">
            </a>

            <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
                <img src="../assets/img/logos/yt.png" alt="YouTube">
            </a>
        </nav>

        <p>&copy; <span id="year"></span> Todos los Derechos Reservados</p>
    </footer>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script>
    AOS.init({
        duration: 800,
        once: true
    });
    </script>

</body>

</html>
