<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteForge | Contacto</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <header class="encabezado">
        <nav class="navbar">
            <a href="../index.html" class="logo">ByteForge</a>

            <ul class="menu">
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="armados.html">Armados</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contacto">
            <h1>Contacto</h1>
            <p>¿Tenés alguna consulta? Escribinos y te respondemos.</p>

            <form class="formulario">
                <div>
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div>
                    <label for="email">Correo electronico</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div>
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
                </div>

                <button type="submit" class="boton">Enviar</button>
            </form>
        </section>
    </main>

    <footer class="pie-pagina">
        <p>ByteForge - Hardware y tecnología</p>
        <p>&copy; <span id="year"></span> Todos los Derechos Reservados</p>
    </footer>

    <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    </script>

</body>

</html>
